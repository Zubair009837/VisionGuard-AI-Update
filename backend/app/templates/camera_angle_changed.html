<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Camera Angle Changed</title></head>
<body style="font-family:Arial,sans-serif;background:#f5f7fb;padding:24px;">
  <div style="max-width:680px;margin:auto;background:#fff;border-radius:10px;padding:24px;border:1px solid #e5e7eb;">
    <h2 style="margin-top:0;color:#dc2626;">🚨 Camera Angle Changed</h2>
    <p><strong>VisionGuard AI</strong> detected a global viewpoint change in the camera image.</p>
    <table style="width:100%;border-collapse:collapse;">
      <tr><td style="padding:8px 0;"><strong>Camera</strong></td><td>{{camera}}</td></tr>
      <tr><td style="padding:8px 0;"><strong>NVR</strong></td><td>{{nvr}}</td></tr>
      <tr><td style="padding:8px 0;"><strong>IP</strong></td><td>{{ip}}</td></tr>
      <tr><td style="padding:8px 0;"><strong>Status</strong></td><td>{{status}}</td></tr>
      <tr><td style="padding:8px 0;"><strong>Time</strong></td><td>{{time}}</td></tr>
    </table>
    <p style="margin-top:20px;color:#374151;">Please verify the physical camera position and PTZ settings.</p>
    <p style="font-size:12px;color:#6b7280;">{{issues}}</p>
  </div>
</body>
</html>
